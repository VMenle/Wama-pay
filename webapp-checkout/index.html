<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geräteübersicht – Wama-Pay</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<header class="app-header">
  <div class="app-navbar">
    <a href="index.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
    <nav class="app-nav-links">
      <a href="index.html" class="active">Geräte</a>
      <a href="hilfe.html">Anleitung</a>
      <a href="faq.html">FAQ</a>
      <a href="../webapp-customer/index.html">Mein Konto</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <span class="eyebrow">Waschküche</span>
      <h1>Welche Maschine ist frei?</h1>
      <p>Gerät wählen und den QR-Code am Gerät scannen, um direkt zur Bezahlseite zu gelangen. Der Status wird laufend aktualisiert.</p>
    </div>

    <div id="config-notice"></div>
    <div id="locations-root">
      <p style="color:var(--ink-soft);">Lade Geräte…</p>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; width:100%;">
    <span>© 2026 Wama-Pay</span>
    <span><a href="faq.html">FAQ</a> · <a href="hilfe.html">Anleitung</a> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></span>
    <a href="mailto:info@energy-leisure.de">info@energy-leisure.de</a>
  </div>
</footer>

<script src="../assets/config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
  var DEVICE_LABELS = { washer: "Waschmaschine", dryer: "Trockner", trailer: "Anhänger", card_dispenser: "Kartenspender" };
  var DEVICE_ICONS = { washer: "🌀", dryer: "🌬️", trailer: "🚚", card_dispenser: "💳" };
  var STATUS_LABELS = { free: "Frei", busy: "Belegt", offline: "Offline", maintenance: "Wartung" };

  // Demo-Fallback, solange assets/config.js keine echten Supabase-Werte hat
  // oder die Verbindung fehlschlägt – damit die Seite auch ohne Backend
  // sichtbar funktioniert. Klar als Demo-Daten gekennzeichnet.
  var DEMO_DATA = [
    {
      location: { id: "demo-loc-1", name: "Waschküche Musterstraße 12", address: "Musterstraße 12, 12345 Musterstadt" },
      devices: [
        { id: "demo-1", type: "washer", label: "Waschmaschine 1", status: "free", price_cents: 120, currency: "EUR" },
        { id: "demo-2", type: "washer", label: "Waschmaschine 2", status: "busy", price_cents: 120, currency: "EUR" },
        { id: "demo-3", type: "dryer", label: "Trockner 1", status: "free", price_cents: 90, currency: "EUR" },
        { id: "demo-4", type: "dryer", label: "Trockner 2", status: "maintenance", price_cents: 90, currency: "EUR" }
      ]
    }
  ];

  function formatPrice(cents, currency) {
    return (cents / 100).toLocaleString("de-DE", { style: "currency", currency: currency || "EUR" });
  }

  function renderLocations(groups, isDemo) {
    var root = document.getElementById("locations-root");
    root.innerHTML = "";

    if (isDemo) {
      var notice = document.createElement("div");
      notice.className = "notice notice-warn";
      notice.textContent = "Hinweis: Supabase ist noch nicht verbunden (siehe assets/config.js) – es werden Demo-Geräte angezeigt.";
      root.appendChild(notice);
    }

    if (!groups.length) {
      var empty = document.createElement("p");
      empty.style.color = "var(--ink-soft)";
      empty.textContent = "Aktuell sind keine Geräte verfügbar.";
      root.appendChild(empty);
      return;
    }

    groups.forEach(function (group) {
      var section = document.createElement("section");
      section.className = "location-group";

      var h2 = document.createElement("h2");
      h2.innerHTML = group.location.name + (group.location.address ? ' <span class="loc-address">· ' + group.location.address + "</span>" : "");
      section.appendChild(h2);

      var grid = document.createElement("div");
      grid.className = "device-grid";

      group.devices.forEach(function (d) {
        var isFree = d.status === "free";
        var card = document.createElement(isFree ? "a" : "div");
        card.className = "device-card";
        if (isFree) {
          card.href = "bezahlen.html?device=" + encodeURIComponent(d.id);
        } else {
          card.setAttribute("aria-disabled", "true");
        }

        card.innerHTML =
          '<div class="device-card-top">' +
            '<span class="device-icon">' + (DEVICE_ICONS[d.type] || "⚙️") + '</span>' +
            '<span class="status-badge status-' + d.status + '"><span class="status-dot"></span>' + (STATUS_LABELS[d.status] || d.status) + '</span>' +
          '</div>' +
          '<h3>' + d.label + '</h3>' +
          '<div class="device-meta">' + (DEVICE_LABELS[d.type] || d.type) + '</div>' +
          '<div class="device-price">' + formatPrice(d.price_cents, d.currency) + ' / Nutzung</div>';

        grid.appendChild(card);
      });

      section.appendChild(grid);
      root.appendChild(section);
    });
  }

  async function loadFromSupabase() {
    var client = await window.wamaSupabaseReady;
    var cfg = window.WAMA_PAY_CONFIG;
    if (!cfg.supabaseUrl || cfg.supabaseUrl.indexOf("TODO_") === 0) {
      throw new Error("Supabase nicht konfiguriert");
    }

    var { data: project, error: projectErr } = await client
      .from("projects").select("id").eq("key", cfg.projectKey).single();
    if (projectErr || !project) throw projectErr || new Error("Projekt nicht gefunden");

    var { data: locations, error: locErr } = await client
      .from("locations").select("id, name, address").eq("project_id", project.id);
    if (locErr) throw locErr;

    var { data: devices, error: devErr } = await client
      .from("devices").select("id, type, label, status, location_id").eq("project_id", project.id);
    if (devErr) throw devErr;

    var { data: products, error: prodErr } = await client
      .from("products").select("device_type, location_id, price_cents, currency")
      .eq("project_id", project.id).eq("is_active", true);
    if (prodErr) throw prodErr;

    function priceFor(device) {
      var p = products.find(function (p) { return p.location_id === device.location_id && p.device_type === device.type; })
        || products.find(function (p) { return !p.location_id && p.device_type === device.type; });
      return p ? { price_cents: p.price_cents, currency: p.currency } : { price_cents: 0, currency: "EUR" };
    }

    return locations.map(function (loc) {
      return {
        location: loc,
        devices: devices.filter(function (d) { return d.location_id === loc.id; })
          .map(function (d) { return Object.assign({}, d, priceFor(d)); })
      };
    }).filter(function (g) { return g.devices.length > 0; });
  }

  loadFromSupabase()
    .then(function (groups) { renderLocations(groups, false); })
    .catch(function () { renderLocations(DEMO_DATA, true); });
</script>

</body>
</html>
