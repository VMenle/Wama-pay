<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freigegeben – Wama-Pay</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<header class="app-header">
  <div class="app-navbar">
    <a href="index.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
  </div>
</header>

<main>
  <div class="wrap-narrow">
    <div class="process-panel">
      <div class="process-check">✓</div>
      <h1 style="font-size:22px; margin-bottom:8px;">Gerät freigegeben</h1>
      <p style="color:var(--ink-soft); font-size:14.5px; margin-bottom:24px;">
        Die Zahlung wurde bestätigt, das Gerät läuft jetzt den vollständigen
        Waschgang durch. Es stoppt nicht vorzeitig nach einer festen Zeit.
      </p>

      <div id="notify-block" class="card" style="text-align:left; margin-bottom:20px;">
        <h3 style="font-size:15px; margin-bottom:6px;">Benachrichtigung, wenn fertig?</h3>
        <p id="notify-status" style="font-size:13.5px; color:var(--ink-soft);">Lade Einstellung…</p>
      </div>

      <a href="index.html" class="btn-primary btn-block">Zur Geräteübersicht</a>
    </div>
  </div>
</main>

<script src="../assets/config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
  // Die "Maschine fertig"-Benachrichtigung ist eine globale Kontoeinstellung
  // (customer_notification_settings, siehe webapp-customer/benachrichtigungen.html),
  // nicht pro Order einzeln aktivierbar -- der n8n-Workflow
  // "order-released-notify-fertig" liest sie automatisch für jede Order
  // dieses Kunden. Hier wird nur der aktuelle Stand angezeigt.
  var statusEl = document.getElementById("notify-status");

  function showLoginHint() {
    statusEl.innerHTML = 'Nur mit Login verfügbar. <a href="../webapp-customer/index.html" style="color:var(--blue); font-weight:700;">Jetzt anmelden</a>';
  }

  (async function () {
    try {
      var cfg = window.WAMA_PAY_CONFIG;
      if (!cfg.supabaseUrl || cfg.supabaseUrl.indexOf("TODO_") === 0) throw new Error("no config");
      var client = await window.wamaSupabaseReady;
      var { data: sessionData } = await client.auth.getSession();
      if (!sessionData || !sessionData.session) {
        showLoginHint();
        return;
      }

      var { data: settings } = await client
        .from("customer_notification_settings")
        .select("notify_on_release")
        .eq("customer_id", sessionData.session.user.id)
        .maybeSingle();

      if (settings && settings.notify_on_release) {
        statusEl.innerHTML = 'Aktiv – Sie werden per E-Mail benachrichtigt, sobald der Waschgang fertig ist. <a href="../webapp-customer/benachrichtigungen.html" style="color:var(--blue); font-weight:700;">Einstellung ändern</a>';
      } else {
        statusEl.innerHTML = 'Deaktiviert. <a href="../webapp-customer/benachrichtigungen.html" style="color:var(--blue); font-weight:700;">Jetzt aktivieren</a>';
      }
    } catch (e) {
      showLoginHint();
    }
  })();
</script>

</body>
</html>
