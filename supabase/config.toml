# Wama-Pay – Supabase-Projektkonfiguration (für `supabase` CLI).
#
# payment-webhook wird direkt von SumUp aufgerufen, nicht über supabase-js --
# es liegt also kein gültiges Supabase-JWT im Authorization-Header vor. Die
# Standardprüfung der Edge-Function-Laufzeit (verify_jwt = true) würde den
# Request deshalb schon vor Erreichen unseres Codes mit 401 ablehnen.
# Die eigentliche Authentizitätsprüfung übernimmt stattdessen der SumUp-
# Adapter selbst (geteiltes Secret, siehe
# supabase/functions/_shared/sumupAdapter.ts::verifyWebhookRequest).
[functions.payment-webhook]
verify_jwt = false

# create-checkout wird ausschließlich über supabase-js (client.functions.invoke)
# aus der Checkout-Webapp aufgerufen, die immer mindestens den anon-Key als
# JWT mitschickt (bei eingeloggten Kunden das User-JWT) -- Standardprüfung
# bleibt hier aktiv.
[functions.create-checkout]
verify_jwt = true

# kontist-oauth-exchange wird einmalig direkt im Browser aufgerufen (kein
# JWT im Request), siehe Datei-Kommentar in der Function selbst.
[functions.kontist-oauth-exchange]
verify_jwt = false

# reconcile-provider-order wird von pg_net/pg_cron aus der Datenbank heraus
# aufgerufen (siehe Migration 0024), kein JWT im Request.
[functions.reconcile-provider-order]
verify_jwt = false
