name: Deploy Supabase Edge Functions

# Deployt die Edge Functions (create-checkout, payment-webhook) automatisch
# ins Supabase-Projekt -- läuft komplett bei GitHub, keine lokale
# Installation der Supabase-CLI nötig. Voraussetzung: zwei Repository-
# Secrets sind gesetzt (siehe supabase/functions/README.md, Abschnitt
# "Deployment ohne lokale CLI"):
#   SUPABASE_ACCESS_TOKEN  -- persönlicher Zugriffstoken aus dem
#                             Supabase-Dashboard (Account -> Access Tokens)
#   SUPABASE_PROJECT_ID    -- Projekt-Referenz, z.B. qhnqselrrawmgcrpuazx
#                             (steht auch in assets/config.js in der URL)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy create-checkout
        working-directory: .
        run: supabase functions deploy create-checkout --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy payment-webhook
        working-directory: .
        run: supabase functions deploy payment-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy device-override
        working-directory: .
        run: supabase functions deploy device-override --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy kontist-oauth-exchange
        working-directory: .
        run: supabase functions deploy kontist-oauth-exchange --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy reconcile-provider-order
        working-directory: .
        run: supabase functions deploy reconcile-provider-order --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
