<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Konto – Wama-Pay</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<header class="app-header">
  <div class="app-navbar">
    <a href="dashboard.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
    <nav class="app-nav-links">
      <a href="dashboard.html" class="active">Guthaben</a>
      <a href="konto.html">Kontodaten</a>
      <a href="benachrichtigungen.html">Benachrichtigungen</a>
      <a href="../webapp-checkout/index.html">Geräte</a>
      <a href="#" id="logout-link">Abmelden</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <span class="eyebrow">Guthabenkonto</span>
      <h1>Mein Guthaben</h1>
      <p>Ihr Guthaben wird in Anzahl Waschgängen geführt, nicht in Euro.</p>
    </div>

    <div id="root">
      <p style="color:var(--ink-soft);">Lade Kontodaten…</p>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; width:100%;">
    <span>© 2026 Wama-Pay</span>
    <span><a href="../webapp-checkout/faq.html">FAQ</a> · <a href="../webapp-checkout/datenschutz.html">Datenschutz</a></span>
    <a href="mailto:info@energy-leisure.de">info@energy-leisure.de</a>
  </div>
</footer>

<script src="../assets/config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
  var TX_LABELS = { topup: "Aufladung", consumption: "Verbrauch", bonus: "Bonus", refund: "Rückerstattung" };

  function formatWashes(n) {
    return n + (Math.abs(n) === 1 ? " Waschgang" : " Waschgänge");
  }

  function renderDashboard(balance, transactions) {
    var root = document.getElementById("root");
    root.innerHTML = "";

    var statRow = document.createElement("div");
    statRow.className = "stat-row";
    statRow.innerHTML =
      '<div class="stat-tile"><div class="stat-label">Aktuelles Guthaben</div><div class="stat-value">' + balance + '<span class="unit">Waschgänge</span></div></div>';
    root.appendChild(statRow);

    var actions = document.createElement("div");
    actions.style.cssText = "margin-bottom:24px;";
    actions.innerHTML = '<button class="btn-primary" id="topup-btn">Guthaben aufladen</button>';
    root.appendChild(actions);

    var todoNotice = document.createElement("div");
    todoNotice.className = "notice notice-todo";
    todoNotice.textContent =
      "TODO (Checkout-Anbindung folgt zuletzt): Aufladung läuft künftig über " +
      "denselben SumUp-Zahlungsweg wie der Geräte-Checkout; die Gutschrift " +
      "erfolgt serverseitig nach bestätigter Zahlung als wallet_transactions-Eintrag.";
    root.appendChild(todoNotice);
    document.getElementById("topup-btn").addEventListener("click", function () {
      alert("Aufladung ist noch nicht angebunden (folgt mit der Checkout-Integration).");
    });

    var h2 = document.createElement("h2");
    h2.style.cssText = "font-size:18px; margin:24px 0 14px;";
    h2.textContent = "Transaktionsverlauf";
    root.appendChild(h2);

    if (!transactions.length) {
      var empty = document.createElement("p");
      empty.style.color = "var(--ink-soft)";
      empty.textContent = "Noch keine Transaktionen.";
      root.appendChild(empty);
      return;
    }

    var card = document.createElement("div");
    card.className = "card";
    var table = document.createElement("table");
    table.className = "tx-table";
    table.innerHTML = "<thead><tr><th>Datum</th><th>Art</th><th>Menge</th><th>Notiz</th></tr></thead>";
    var tbody = document.createElement("tbody");
    transactions.forEach(function (tx) {
      var tr = document.createElement("tr");
      var amountClass = tx.amount_washes > 0 ? "tx-amount-positive" : "tx-amount-negative";
      var sign = tx.amount_washes > 0 ? "+" : "";
      tr.innerHTML =
        "<td>" + new Date(tx.created_at).toLocaleDateString("de-DE") + "</td>" +
        "<td>" + (TX_LABELS[tx.type] || tx.type) + "</td>" +
        '<td class="' + amountClass + '">' + sign + tx.amount_washes + "</td>" +
        "<td>" + (tx.note || "") + "</td>";
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);
    root.appendChild(card);
  }

  (async function init() {
    var cfg = window.WAMA_PAY_CONFIG;
    if (!cfg.supabaseUrl || cfg.supabaseUrl.indexOf("TODO_") === 0) {
      renderDashboard(0, []);
      var notice = document.createElement("div");
      notice.className = "notice notice-warn";
      notice.textContent = "Hinweis: Supabase ist noch nicht verbunden – es können keine echten Kontodaten geladen werden.";
      document.getElementById("root").prepend(notice);
      return;
    }

    var client = await window.wamaSupabaseReady;
    var { data: sessionData } = await client.auth.getSession();
    if (!sessionData || !sessionData.session) {
      window.location.href = "index.html";
      return;
    }
    var userId = sessionData.session.user.id;

    document.getElementById("logout-link").addEventListener("click", async function (e) {
      e.preventDefault();
      await client.auth.signOut();
      window.location.href = "index.html";
    });

    var { data: balances } = await client.from("wallet_balances").select("balance_washes, project_id").eq("customer_id", userId);
    var totalBalance = (balances || []).reduce(function (sum, b) { return sum + b.balance_washes; }, 0);

    var { data: transactions } = await client
      .from("wallet_transactions").select("type, amount_washes, note, created_at")
      .eq("customer_id", userId).order("created_at", { ascending: false }).limit(50);

    renderDashboard(totalBalance, transactions || []);
  })();
</script>

</body>
</html>
