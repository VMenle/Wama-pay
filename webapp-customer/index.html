<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden – Wama-Pay Kundenkonto</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<header class="app-header">
  <div class="app-navbar">
    <a href="../webapp-checkout/index.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
    <nav class="app-nav-links">
      <a href="../webapp-checkout/index.html">← Zur Geräteübersicht</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap-narrow">
    <div class="page-head">
      <span class="eyebrow">Kundenkonto</span>
      <h1 id="form-title">Anmelden</h1>
      <p id="form-subtitle">Mit E-Mail-Adresse anmelden, um Guthaben, Bankdaten und Benachrichtigungen zu verwalten.</p>
    </div>

    <div id="config-notice"></div>

    <div class="card" style="max-width:440px;">
      <form id="auth-form">
        <div class="field">
          <label for="email">E-Mail</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input type="password" id="password" required autocomplete="current-password" minlength="8">
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Anmelden</button>
        <div class="form-error" id="form-error" style="display:none;"></div>
        <div class="form-success" id="form-success" style="display:none;"></div>
      </form>

      <p style="margin-top:16px; font-size:13.5px; color:var(--ink-soft);">
        <span id="toggle-mode-text">Noch kein Konto?</span>
        <a href="#" id="toggle-mode-link" style="color:var(--blue); font-weight:700;">Jetzt registrieren</a>
      </p>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; width:100%;">
    <span>© 2026 Wama-Pay</span>
    <span><a href="../webapp-checkout/faq.html">FAQ</a> · <a href="../webapp-checkout/datenschutz.html">Datenschutz</a></span>
    <a href="mailto:info@energy-leisure.de">info@energy-leisure.de</a>
  </div>
</footer>

<script src="../assets/config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
  var mode = "signin"; // 'signin' | 'signup'

  function setMode(next) {
    mode = next;
    var isSignup = mode === "signup";
    document.getElementById("form-title").textContent = isSignup ? "Registrieren" : "Anmelden";
    document.getElementById("submit-btn").textContent = isSignup ? "Konto erstellen" : "Anmelden";
    document.getElementById("toggle-mode-text").textContent = isSignup ? "Bereits ein Konto?" : "Noch kein Konto?";
    document.getElementById("toggle-mode-link").textContent = isSignup ? "Jetzt anmelden" : "Jetzt registrieren";
    document.getElementById("form-error").style.display = "none";
    document.getElementById("form-success").style.display = "none";
  }

  document.getElementById("toggle-mode-link").addEventListener("click", function (e) {
    e.preventDefault();
    setMode(mode === "signup" ? "signin" : "signup");
  });

  function showError(msg) {
    var el = document.getElementById("form-error");
    el.textContent = msg;
    el.style.display = "block";
    document.getElementById("form-success").style.display = "none";
  }
  function showSuccess(msg) {
    var el = document.getElementById("form-success");
    el.textContent = msg;
    el.style.display = "block";
    document.getElementById("form-error").style.display = "none";
  }

  document.getElementById("auth-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    var btn = document.getElementById("submit-btn");
    btn.disabled = true;

    try {
      var cfg = window.WAMA_PAY_CONFIG;
      if (!cfg.supabaseUrl || cfg.supabaseUrl.indexOf("TODO_") === 0) {
        throw new Error("Supabase ist noch nicht konfiguriert (siehe assets/config.js).");
      }
      var client = await window.wamaSupabaseReady;

      if (mode === "signup") {
        var { error } = await client.auth.signUp({ email: email, password: password });
        if (error) throw error;
        showSuccess("Registrierung erfolgreich. Bitte bestätigen Sie Ihre E-Mail-Adresse über den zugesendeten Link, bevor Sie sich anmelden.");
      } else {
        var { error: signInError } = await client.auth.signInWithPassword({ email: email, password: password });
        if (signInError) throw signInError;
        window.location.href = "dashboard.html";
      }
    } catch (err) {
      showError(err.message || "Ein Fehler ist aufgetreten.");
    } finally {
      btn.disabled = false;
    }
  });

  (async function checkExistingSession() {
    try {
      var cfg = window.WAMA_PAY_CONFIG;
      if (!cfg.supabaseUrl || cfg.supabaseUrl.indexOf("TODO_") === 0) {
        var notice = document.createElement("div");
        notice.className = "notice notice-warn";
        notice.textContent = "Hinweis: Supabase ist noch nicht verbunden (siehe assets/config.js) – Login ist aktuell nicht funktionsfähig.";
        document.getElementById("config-notice").appendChild(notice);
        return;
      }
      var client = await window.wamaSupabaseReady;
      var { data } = await client.auth.getSession();
      if (data && data.session) window.location.href = "dashboard.html";
    } catch (e) { /* ignore, Formular bleibt nutzbar sobald konfiguriert */ }
  })();
</script>

</body>
</html>
