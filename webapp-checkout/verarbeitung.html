<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zahlung wird verarbeitet – Wama-Pay</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<header class="app-header">
  <div class="app-navbar">
    <a href="index.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
  </div>
</header>

<main>
  <div class="wrap-narrow">
    <div id="redirect-hint" class="notice notice-info" style="max-width:440px; margin:0 auto 20px; display:none;">
      Sie werden zur Zahlungsseite von SumUp weitergeleitet…
      <a id="redirect-link" href="#" style="color:var(--blue); font-weight:700;">Nicht automatisch weitergeleitet? Hier klicken.</a>
    </div>

    <div class="process-panel">
      <div class="process-spinner" id="spinner"></div>
      <h1 id="process-title" style="font-size:20px; margin-bottom:8px;">Zahlung wird geprüft…</h1>
      <p id="process-subtitle" style="color:var(--ink-soft); font-size:14px;">Bitte schließen Sie dieses Fenster nicht.</p>

      <ul class="process-steps" id="steps">
        <li id="step-1"><span class="dot"></span> Zahlung wird bestätigt</li>
        <li id="step-2"><span class="dot"></span> Gerät wird freigeschaltet</li>
        <li id="step-3"><span class="dot"></span> Bereit zur Nutzung</li>
      </ul>

      <div id="error-block" style="display:none; margin-top:20px;">
        <div class="notice notice-warn" id="error-message"></div>
        <a href="index.html" class="btn-ghost btn-block">Zurück zur Übersicht</a>
      </div>
    </div>
  </div>
</main>

<script src="../assets/config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get("order");
  var redirectUrl = params.get("redirect");

  // Sicherheitsnetz: falls create-checkout eine SumUp-Weiterleitungs-URL
  // geliefert hat (gehostete Zahlungsseite), dorthin schicken. Aktuell
  // liefert der SumUp-Adapter noch keine redirect_url (TODO, siehe
  // supabase/functions/_shared/sumupAdapter.ts) -- dieser Zweig greift also
  // erst, sobald das ergänzt ist.
  if (redirectUrl) {
    document.getElementById("redirect-hint").style.display = "block";
    var link = document.getElementById("redirect-link");
    link.href = redirectUrl;
    setTimeout(function () { window.location.href = redirectUrl; }, 1500);
  }

  function markDone(id) { document.getElementById(id).classList.add("done"); }

  function showError(message) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("process-title").textContent = "Zahlung nicht erfolgreich";
    document.getElementById("process-subtitle").style.display = "none";
    document.getElementById("error-message").textContent = message;
    document.getElementById("error-block").style.display = "block";
  }

  function applyStatus(status) {
    if (status === "reserved" || status === "payment_pending") {
      // noch nichts abgeschlossen, weiter warten
      return "pending";
    }
    if (status === "paid") {
      markDone("step-1");
      return "pending";
    }
    if (status === "released") {
      markDone("step-1");
      markDone("step-2");
      markDone("step-3");
      return "done";
    }
    if (status === "failed" || status === "expired") {
      showError(
        status === "expired"
          ? "Das Zeitfenster für die Zahlung ist abgelaufen. Bitte erneut versuchen."
          : "Die Zahlung ist fehlgeschlagen oder wurde abgebrochen."
      );
      return "failed";
    }
    return "pending";
  }

  var POLL_INTERVAL_MS = 1500;
  var MAX_POLLS = 80; // ~2 Minuten
  var pollCount = 0;

  async function pollOrderStatus() {
    if (!orderId) {
      showError("Keine Order angegeben.");
      return;
    }

    var cfg = window.WAMA_PAY_CONFIG;
    if (!cfg.supabaseUrl || cfg.supabaseUrl.indexOf("TODO_") === 0) {
      showError("Supabase ist noch nicht konfiguriert (siehe assets/config.js) – Order-Status kann nicht abgefragt werden.");
      return;
    }

    var client = await window.wamaSupabaseReady;

    var poll = async function () {
      pollCount++;
      var { data, error } = await client.rpc("get_order_status", { p_order_id: orderId });

      if (error) {
        showError("Order-Status konnte nicht abgerufen werden: " + error.message);
        return;
      }

      var row = Array.isArray(data) ? data[0] : data;
      if (!row) {
        showError("Order nicht gefunden.");
        return;
      }

      var outcome = applyStatus(row.status);

      if (outcome === "done") {
        window.location.href = "freigabe.html?order=" + encodeURIComponent(orderId);
        return;
      }
      if (outcome === "failed") {
        return; // showError() wurde bereits aufgerufen
      }
      if (pollCount >= MAX_POLLS) {
        showError("Die Zahlung konnte nicht rechtzeitig bestätigt werden. Bitte prüfen Sie den Status später erneut oder wenden Sie sich an den Support.");
        return;
      }
      setTimeout(poll, POLL_INTERVAL_MS);
    };

    poll();
  }

  pollOrderStatus();
</script>

</body>
</html>
