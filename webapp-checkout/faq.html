<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ – Wama-Pay</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<header class="app-header">
  <div class="app-navbar">
    <a href="index.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
    <nav class="app-nav-links">
      <a href="index.html">Geräte</a>
      <a href="hilfe.html">Anleitung</a>
      <a href="faq.html" class="active">FAQ</a>
      <a href="../webapp-customer/index.html">Mein Konto</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <span class="eyebrow">Häufige Fragen</span>
      <h1>FAQ</h1>
      <p>Antworten auf die häufigsten Fragen zur Nutzung von Wama-Pay.</p>
    </div>

    <div class="faq-list" id="faq-list"></div>
  </div>
</main>

<footer class="app-footer">
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; width:100%;">
    <span>© 2026 Wama-Pay</span>
    <span><a href="hilfe.html">Anleitung</a> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></span>
    <a href="mailto:info@energy-leisure.de">info@energy-leisure.de</a>
  </div>
</footer>

<script>
  var faqs = [
    {
      q: "Wie bezahle ich einen Waschgang?",
      a: "QR-Code am Gerät scannen (oder in der Geräteübersicht ein freies Gerät auswählen), Zahlweise wählen (SumUp-Direktzahlung oder, mit Login, vom Guthaben) und bezahlen. Nach bestätigtem Zahlungseingang schaltet sich das Gerät automatisch frei."
    },
    {
      q: "Wird pro Zeit oder pro Waschgang abgerechnet?",
      a: "Ausschließlich pro Waschgang bzw. Trocknergang – ein Preis pro Nutzung, unabhängig davon wie lange das Programm tatsächlich läuft."
    },
    {
      q: "Was ist das Guthabenkonto?",
      a: "Mit einem kostenlosen Kundenkonto können Sie Guthaben in Anzahl Waschgängen aufladen und direkt davon bezahlen, ohne bei jeder Nutzung erneut die Kartenzahlung durchzuführen. Guthaben ist projektgebunden (siehe Datenschutzerklärung)."
    },
    {
      q: "Wie erfahre ich, wann meine Wäsche fertig ist?",
      a: "Nach der Freigabe können Sie (mit Login) eine automatische Benachrichtigung aktivieren, die Sie informiert, sobald der Waschgang beendet ist."
    },
    {
      q: "Was passiert, wenn die Zahlung nicht bestätigt wird?",
      a: "Erfolgt innerhalb des Zeitfensters keine Zahlungsbestätigung, wird die Reservierung automatisch aufgehoben. Bereits abgebuchte, aber nicht bestätigte Beträge werden erstattet – es erfolgt nie eine stille Fehlbuchung."
    },
    {
      q: "Wo werden meine Daten gespeichert?",
      a: "Ausschließlich auf Servern in der EU (Hetzner, Supabase EU-Region), DSGVO-konform. Details in der Datenschutzerklärung."
    }
  ];

  var root = document.getElementById("faq-list");
  faqs.forEach(function (item) {
    var el = document.createElement("div");
    el.className = "faq-item";
    el.innerHTML =
      '<button class="faq-q" type="button"><span>' + item.q + '</span><span class="faq-toggle">+</span></button>' +
      '<div class="faq-a"><p>' + item.a + '</p></div>';
    root.appendChild(el);
  });

  document.querySelectorAll(".faq-item").forEach(function (item) {
    var q = item.querySelector(".faq-q");
    q.addEventListener("click", function () {
      var wasOpen = item.classList.contains("open");
      document.querySelectorAll(".faq-item.open").forEach(function (o) { if (o !== item) o.classList.remove("open"); });
      item.classList.toggle("open", !wasOpen);
    });
  });
</script>

</body>
</html>
