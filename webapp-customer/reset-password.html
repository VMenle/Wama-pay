<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neues Passwort – Wama-Pay</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>

<!--
  Wama-Pay – Ziel der "Passwort vergessen"-E-Mail (ausgelöst von
  webapp-customer/index.html und webapp-admin/index.html, beide teilen
  sich dasselbe Supabase-Auth-Konto). Supabase-js parst beim Laden dieser
  Seite automatisch den Recovery-Token aus der URL (detectSessionInUrl,
  Standardeinstellung) und löst intern das Auth-Event PASSWORD_RECOVERY
  aus -- erst danach ist client.auth.updateUser({password}) zulässig.
-->

<header class="app-header">
  <div class="app-navbar">
    <a href="../webapp-checkout/index.html" class="app-brand"><span class="app-brand-mark"></span>Wama-Pay</a>
  </div>
</header>

<main>
  <div class="wrap-narrow">
    <div class="page-head">
      <span class="eyebrow">Konto</span>
      <h1 style="font-size:22px;">Neues Passwort setzen</h1>
    </div>

    <div class="card" style="max-width:440px;">
      <div id="waiting-notice">Link wird geprüft…</div>

      <form id="reset-form" style="display:none;">
        <div class="field">
          <label for="password">Neues Passwort</label>
          <input type="password" id="password" required autocomplete="new-password" minlength="8">
        </div>
        <div class="field">
          <label for="password2">Neues Passwort wiederholen</label>
          <input type="password" id="password2" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Passwort speichern</button>
        <div class="form-error" id="form-error" style="display:none;"></div>
        <div class="form-success" id="form-success" style="display:none;"></div>
      </form>

      <div class="notice notice-warn" id="invalid-notice" style="display:none;">
        Dieser Link ist ungültig oder abgelaufen. Bitte auf der Anmeldeseite erneut "Passwort vergessen?" anfordern.
      </div>
    </div>
  </div>
</main>

<script src="../assets/config.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
  var recoveryReady = false;

  (async function () {
    var client = await window.wamaSupabaseReady;

    client.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        document.getElementById("waiting-notice").style.display = "none";
        document.getElementById("reset-form").style.display = "block";
      }
    });

    // Falls das PASSWORD_RECOVERY-Event beim Laden schon durchgelaufen ist,
    // bevor der obige Listener registriert wurde: Session direkt prüfen.
    setTimeout(async function () {
      if (recoveryReady) return;
      var { data } = await client.auth.getSession();
      if (data && data.session) {
        recoveryReady = true;
        document.getElementById("waiting-notice").style.display = "none";
        document.getElementById("reset-form").style.display = "block";
      } else {
        document.getElementById("waiting-notice").style.display = "none";
        document.getElementById("invalid-notice").style.display = "block";
      }
    }, 2500);
  })();

  document.getElementById("reset-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var errorEl = document.getElementById("form-error");
    var successEl = document.getElementById("form-success");
    errorEl.style.display = "none";
    successEl.style.display = "none";

    var pw1 = document.getElementById("password").value;
    var pw2 = document.getElementById("password2").value;
    if (pw1 !== pw2) {
      errorEl.textContent = "Die beiden Passwörter stimmen nicht überein.";
      errorEl.style.display = "block";
      return;
    }

    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    try {
      var client = await window.wamaSupabaseReady;
      var { error } = await client.auth.updateUser({ password: pw1 });
      if (error) throw error;
      successEl.textContent = "Passwort gespeichert. Sie können sich jetzt damit anmelden.";
      successEl.style.display = "block";
      document.getElementById("reset-form").style.display = "none";
    } catch (err) {
      errorEl.textContent = err.message || "Fehler beim Speichern des Passworts.";
      errorEl.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
